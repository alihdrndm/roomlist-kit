packages:
  - "packages/*"
  - "apps/*"

# Carried over from create-next-app: do not run install scripts for these.
allowBuilds:
  sharp: false
  unrs-resolver: false
  # Telemetry package pulled in by Swagger UI; never run its install script.
  "@scarf/scarf": false
  # Pulled in by sst; its install script only prints a maintenance notice.
  aws-sdk: false
