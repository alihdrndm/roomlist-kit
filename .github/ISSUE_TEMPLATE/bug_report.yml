name: Bug report
description: Something is validated, converted or compared wrongly, or the app misbehaves.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never attach a real rooming list**: guest names, emails, passports and dates of birth are personal data. Reduce the problem to a few made-up rows instead.
        Security problems go to a private report, not here (see SECURITY.md).
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options: [Web app, REST API, CLI, Library (roomlist-core), Docker / deployment]
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal input
      description: A few synthetic rows (CSV text is easiest), the block JSON if you used one, and the target/options.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The output, issue codes (for example R004) or error code and request id (`instance`).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or a commit SHA
