name: Feature request
description: A new PMS target, rule or capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do with a rooming list, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: For a new PMS target, link the vendor's import documentation or template if it is public.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you use now
